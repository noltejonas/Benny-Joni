<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F4F3F8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Benny &amp; Joni</title>
  <script>
    try {
      var t = localStorage.getItem('pt:theme2') || 'system';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <!-- build:fonts -->
  <!-- Schrift liegt in der App (SIL OFL, vendor/fonts/OFL.txt): keine Anfrage an fremde Server. -->
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css" />
  <!-- /build -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="redesign.css" />
  <link rel="stylesheet" href="onboarding.css" />
  <style>
    /* Startplatzhalter und Notfallansicht. Eigene Farben, damit beides auch ohne
       die übrigen CSS-Dateien steht; Werte wie --bg/--text/--primary in redesign.css. */
    .pt-boot {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      background: #F4F3F8; color: #1C1B2E;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .pt-boot-name { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .pt-boot-spinner {
      width: 36px; height: 36px; border-radius: 999px;
      border: 3px solid #ECEAF3; border-top-color: #4F46E5;
      animation: pt-boot-spin 0.9s linear infinite;
    }
    .pt-boot-text {
      font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5C74;
    }
    .pt-boot-msg { font-size: 16px; font-weight: 600; line-height: 1.45; max-width: 280px; color: #5F5C74; }
    .pt-boot-btn {
      margin-top: 8px; height: 52px; padding: 0 28px; border: 0; border-radius: 16px;
      background: #4F46E5; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700;
    }
    [data-theme="dark"] .pt-boot { background: #16151F; color: #F1F0F7; }
    [data-theme="dark"] .pt-boot-spinner { border-color: #353345; border-top-color: #8B7CFF; }
    [data-theme="dark"] .pt-boot-text,
    [data-theme="dark"] .pt-boot-msg { color: #B9B6CC; }
    [data-theme="dark"] .pt-boot-btn { background: #8B7CFF; color: #16151F; }
    @keyframes pt-boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Platzhalter bis zum ersten React-Render; React leert #root dabei selbst. -->
  <div id="root"><div id="pt-boot" class="pt-boot" role="status" aria-live="polite">
    <div class="pt-boot-name">Benny &amp; Joni</div>
    <div class="pt-boot-spinner" aria-hidden="true"></div>
    <div class="pt-boot-text">Starte…</div>
  </div></div>

  <script>
    // Start-Wächter: Lädt ein Skript nicht oder steht nach 15 s noch der
    // Platzhalter (React hat nie gerendert), zeigt schlichtes HTML mit
    // „Neu laden“. Kommt das Netz zurück, lädt die Seite von selbst neu.
    (function () {
      var LIMIT_MS = 15000;
      var shown = false;
      // Sprache wie in i18n.js (Einstellung pt:lang, sonst Gerätesprache, sonst
      // Englisch). i18n.js lädt erst nach den Bibliotheken, deshalb stehen die
      // wenigen Texte für Platzhalter und Notfallansicht hier selbst.
      var lang = (function () {
        var ok = { de: 1, en: 1 };
        try { var pref = localStorage.getItem('pt:lang'); if (ok[pref]) return pref; } catch (e) {}
        var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; i < tags.length; i++) {
          var base = String(tags[i] || '').toLowerCase().split(/[-_]/)[0];
          if (ok[base]) return base;
        }
        return 'en';
      })();
      var TEXT = lang === 'de'
        ? { start: 'Starte…', fail: 'App konnte nicht starten. Prüfe deine Verbindung.', reload: 'Neu laden' }
        : { start: 'Starting…', fail: 'The app couldn’t start. Check your connection.', reload: 'Reload' };
      try {
        document.documentElement.lang = lang;
        var label = document.querySelector('#pt-boot .pt-boot-text');
        if (label) label.textContent = TEXT.start;
      } catch (e) {}
      function stuck() {
        var root = document.getElementById('root');
        return !!document.getElementById('pt-boot') || (root && root.childElementCount === 0);
      }
      function fail(reason) {
        if (shown || !stuck()) return;
        shown = true;
        try { if (window.PTReportError) window.PTReportError(new Error('Start fehlgeschlagen: ' + reason), { where: 'boot' }); } catch (e) {}
        var root = document.getElementById('root');
        root.innerHTML =
          '<div id="pt-boot-fail" class="pt-boot" role="alert">' +
            '<div class="pt-boot-name">Benny &amp; Joni</div>' +
            '<p class="pt-boot-msg">' + TEXT.fail + '</p>' +
            '<button type="button" class="pt-boot-btn">' + TEXT.reload + '</button>' +
          '</div>';
        root.querySelector('button').addEventListener('click', function () { location.reload(); });
        window.addEventListener('online', function () {
          if (document.getElementById('pt-boot-fail')) location.reload();
        });
      }
      // Ladefehler von <script src> steigen nicht auf, darum die Capture-Phase.
      window.addEventListener('error', function (e) {
        var el = e && e.target;
        if (el && el.tagName === 'SCRIPT') fail('Skript ' + (el.getAttribute('src') || '?') + ' nicht geladen');
      }, true);
      setTimeout(function () { fail('nach ' + LIMIT_MS / 1000 + ' s kein Render'); }, LIMIT_MS);
    })();
  </script>

  <!-- build:vendor -->
  <script>
    // Capacitor-Plugins direkt über die native Bridge: iOS legt window.Capacitor
    // samt Capacitor.Plugins.<Name> schon beim Dokumentstart an (WKUserScript),
    // die JS-Seite passt damit immer zur nativen Version. Im Browser und in der
    // Demo ist alles null. Form der Globals wie bisher (data.js, app.jsx,
    // feed.jsx, celebration.jsx, onboarding*.jsx, settings.jsx).
    (function () {
      var C = window.Capacitor;
      var native = false;
      try { native = !!(C && C.isNativePlatform && C.isNativePlatform()); } catch (e) {}
      var P = (native && C.Plugins) || {};
      // Login-Session: data.js nutzt in der App Preferences, im Browser localStorage (null).
      window.PTPreferencesReady = Promise.resolve(P.Preferences ? { Preferences: P.Preferences } : null);
      // Einladungslinks (projektterminator://join/<CODE>), nur nativ.
      window.PTAppReady = Promise.resolve(P.App ? { App: P.App } : null);
      window.PTPushNotifications = P.PushNotifications ? { PushNotifications: P.PushNotifications } : null;
      // Haptik: die native Seite erwartet genau diese Strings (HapticsPlugin.swift).
      window.PTCelebrationHaptics = P.Haptics ? {
        Haptics: P.Haptics,
        ImpactStyle: { Heavy: 'HEAVY', Medium: 'MEDIUM', Light: 'LIGHT' },
        NotificationType: { Success: 'SUCCESS', Warning: 'WARNING', Error: 'ERROR' },
      } : null;
    })();
  </script>

  <!-- Bibliotheken liegen in der App; Herkunft und sha384 stehen in tools/build-web.cjs (VENDOR). -->
  <script src="vendor/supabase-js-2.45.4.min.js"></script>

  <script src="vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="vendor/babel-standalone-7.29.0.min.js"></script>
  <!-- /build -->

  <!-- Sprachen: vor allem anderen, damit tr() überall bereitsteht -->
  <script src="i18n.js"></script>
  <script src="i18n/en.js"></script>

  <script src="data.js"></script>

  <script src="feed-model.js"></script>

  <!-- Shared components -->
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="people.jsx"></script>
  <script type="text/babel" src="celebration.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="feed.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="strafkonto.jsx"></script>

  <!-- Settings / rotation plan -->
  <script type="text/babel" src="settings.jsx"></script>

  <!-- Onboarding, Login, Challenges, Stats über alle Challenges -->
  <script type="text/babel" src="onboarding-figures.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>
  <script type="text/babel" src="competitions.jsx"></script>
  <script type="text/babel" src="stats-charts.jsx"></script>
  <script type="text/babel" src="stats-global.jsx"></script>
  <script type="text/babel" src="ranking.jsx"></script>
  <script type="text/babel" src="onboarding-intro.jsx"></script>

  <!-- App -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
