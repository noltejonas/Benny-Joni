<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F4F3F8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Projekt Terminator</title>
  <script>
    try {
      var t = localStorage.getItem('pt:theme2') || 'system';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <!-- Schrift liegt in der App (SIL OFL, vendor/fonts/OFL.txt): keine Anfrage an fremde Server. -->
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="redesign.css" />
  <link rel="stylesheet" href="onboarding.css" />
</head>
<body>
  <div id="root"></div>

  <script>
    // Login-Session: data.js wartet auf dieses Promise und nutzt in der iOS-App
    // @capacitor/preferences, im Browser localStorage (Wert null).
    window.PTPreferencesReady = new Promise(function (resolve) { window.__ptResolvePreferences = resolve; });
    // App-Plugin für Einladungslinks (projektterminator://join/<CODE>), nur nativ.
    window.PTAppReady = new Promise(function (resolve) { window.__ptResolveApp = resolve; });
  </script>
  <script type="module">
    try {
      if (window.Capacitor?.isNativePlatform?.()) {
        const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/app@8/+esm');
        window.__ptResolveApp(mod);
      } else {
        window.__ptResolveApp(null);
      }
    } catch (e) {
      window.__ptResolveApp(null);
    }
  </script>
  <script type="module">
    try {
      if (window.Capacitor?.isNativePlatform?.()) {
        const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/preferences@8/+esm');
        window.__ptResolvePreferences(mod);
      } else {
        window.__ptResolvePreferences(null);
      }
    } catch (e) {
      window.__ptResolvePreferences(null);
    }
  </script>

  <script type="module">
    // Expose Capacitor Haptics globally for our non-module JSX files.
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/haptics@6/+esm');
      window.PTCelebrationHaptics = mod;
    } catch (e) {
      window.PTCelebrationHaptics = null;
    }
  </script>

  <script type="module">
    // Expose Capacitor PushNotifications only when running natively — the web
    // build has no implementation and would throw UNIMPLEMENTED on every call.
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/push-notifications@8/+esm');
      if (window.Capacitor?.isNativePlatform?.()) {
        window.PTPushNotifications = mod;
      } else {
        window.PTPushNotifications = null;
      }
    } catch (e) {
      window.PTPushNotifications = null;
    }
  </script>

  <!-- Bibliotheken liegen in der App; Herkunft und sha384 stehen in tools/build-web.cjs (VENDOR). -->
  <script src="vendor/supabase-js-2.45.4.min.js"></script>
  <script src="vendor/react-18.3.1.production.min.js"></script>
  <script src="vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="vendor/babel-standalone-7.29.0.min.js"></script>

  <!-- Data layer -->
  <script src="data.js"></script>
  <script src="demo.js"></script>
  <script src="stats-model.js"></script>
  <script src="feed-model.js"></script>
  <script src="onboarding-model.js"></script>

  <!-- Tweaks shell -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Shared components -->
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="people.jsx"></script>
  <script type="text/babel" src="celebration.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="feed.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="strafkonto.jsx"></script>

  <!-- Settings / rotation plan -->
  <script type="text/babel" src="settings.jsx"></script>

  <!-- Onboarding, Login, Challenges, Stats über alle Challenges -->
  <script type="text/babel" src="onboarding.jsx"></script>
  <script type="text/babel" src="competitions.jsx"></script>
  <script type="text/babel" src="stats-charts.jsx"></script>
  <script type="text/babel" src="stats-global.jsx"></script>
  <script type="text/babel" src="onboarding-intro.jsx"></script>

  <!-- App -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
