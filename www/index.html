<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Projekt Terminator</title>
  <script>
    try {
      var t = localStorage.getItem('pt:theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script>
    // Login-Session: data.js wartet auf dieses Promise und nutzt in der iOS-App
    // @capacitor/preferences, im Browser localStorage (Wert null).
    window.PTPreferencesReady = new Promise(function (resolve) { window.__ptResolvePreferences = resolve; });
  </script>
  <script type="module">
    try {
      if (window.Capacitor?.isNativePlatform?.()) {
        const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/preferences@8/+esm');
        window.__ptResolvePreferences(mod);
      } else {
        window.__ptResolvePreferences(null);
      }
    } catch (e) {
      window.__ptResolvePreferences(null);
    }
  </script>

  <script type="module">
    // Expose Capacitor Haptics globally for our non-module JSX files.
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/haptics@6/+esm');
      window.PTCelebrationHaptics = mod;
    } catch (e) {
      window.PTCelebrationHaptics = null;
    }
  </script>

  <script type="module">
    // Expose Capacitor PushNotifications only when running natively — the web
    // build has no implementation and would throw UNIMPLEMENTED on every call.
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@capacitor/push-notifications@8/+esm');
      if (window.Capacitor?.isNativePlatform?.()) {
        window.PTPushNotifications = mod;
      } else {
        window.PTPushNotifications = null;
      }
    } catch (e) {
      window.PTPushNotifications = null;
    }
  </script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data layer -->
  <script src="data.js"></script>

  <!-- Tweaks shell -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Shared components -->
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="people.jsx"></script>
  <script type="text/babel" src="celebration.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="strafkonto.jsx"></script>

  <!-- Settings / rotation plan -->
  <script type="text/babel" src="settings.jsx"></script>

  <!-- Login, Challenges, Stats über alle Challenges -->
  <script type="text/babel" src="competitions.jsx"></script>
  <script type="text/babel" src="stats-global.jsx"></script>

  <!-- App -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
